spring.application.name=finsecure-pay
server.port=8080

# Business configuration - overridable through environment variables
# (APP_VALIDATION_MAX_AMOUNT, APP_VERSION), e.g. from a Kubernetes ConfigMap
app.validation.max-amount=100000
app.version=1.0.0

# Metrics for Prometheus (Task 6)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
